<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>White Morning — Contents preview</title></head><body>
<p id="load-message" style="padding:2rem;font-family:serif">読み込み中… / Loading…</p>
<script>
(async function(){
 try{
  const response=await fetch("/en/",{cache:"no-store"});
  if(!response.ok)throw Error("HTTP "+response.status);
  let html=await response.text();
  html=html.replace(/(<a class="part"[^>]*>)<small>[^<]+<\/small>(<strong>[^<]+<\/strong><\/a>)/g, "$1$2");
  html=html.replace("<head>","<head><base href=\"https://shiroiasa.ohlucinda.com/en/\">");
  html=html.replace("</style>","/* Preview only: single-line chapter titles. */ .section[aria-labelledby=\"contents-title\"] .part strong {margin-top:0;} </style>");
  html=html.replace(/href="\/en\/" lang="en" hreflang="en"/,'href="/preview-toc-20261101/en/" lang="en" hreflang="en"');
  html=html.replace(/href="\/" lang="ja" hreflang="ja"/,'href="/preview-toc-20261101/" lang="ja" hreflang="ja"');
  html=html.replace('</body>', "<script>(function(){\nconst nav=document.querySelector('.section[aria-labelledby=\"contents-title\"] .contents');\nif(!nav)return;\nconst titles=[...nav.querySelectorAll('.part strong')];\nif(titles.length!==5)return;\nconst canvas=document.createElement('canvas');\nconst ctx=canvas.getContext('2d');\nfunction ink(el){\n  const style=getComputedStyle(el);\n  ctx.font=[style.fontStyle,style.fontWeight,style.fontSize,style.fontFamily].join(' ');\n  const m=ctx.measureText(el.textContent.trim()),r=el.getBoundingClientRect();\n  return {left:r.left-m.actualBoundingBoxLeft,right:r.left+m.actualBoundingBoxRight};\n}\nfunction arrange(){\n  nav.style.width='100%';\n  const first=ink(titles[0]),last=ink(titles[4]);\n  const desiredRight=window.innerWidth-first.left;\n  const excess=last.right-desiredRight;\n  if(Number.isFinite(excess))nav.style.width='calc(100% - '+Math.max(0,excess).toFixed(2)+'px)';\n}\narrange();\nwindow.addEventListener('resize',arrange);\nif(document.fonts&&document.fonts.ready)document.fonts.ready.then(arrange);\n})();<\/script></body>");
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById("load-message").textContent="試作の読み込みに失敗しました: "+e.message;}
})();
</script></body></html>
