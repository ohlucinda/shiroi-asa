<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>白い朝</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #07090f;
  color: white;
  font-family: "Hiragino Mincho ProN","Yu Mincho",serif;
}

button { font: inherit; }

/* ───── 入口 ───── */

.entrance {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  background: #07090f;
  z-index: 10;
  transition: opacity 1.4s ease;
}

.title {
  position: absolute;
  top: 8vh;
  left: 0;
  right: 0;
  text-align: center;
  font-size: clamp(24px,4vw,42px);
  letter-spacing: .3em;
  font-weight: 400;
  transition: opacity .8s ease;
}

.donut {
  position: relative;
  width: min(58vw,340px);
  aspect-ratio: 1;
  border-radius: 50%;

  background:
    radial-gradient(circle at 34% 27%,
      #e9c38e 0 7%, transparent 8%),
    radial-gradient(circle at 68% 33%,
      #c99458 0 5%, transparent 6%),
    radial-gradient(circle at 42% 67%,
      #b77b43 0 4%, transparent 5%),
    radial-gradient(circle at 50% 45%,
      #e8bb78,
      #c4874b 58%,
      #8f562e 100%);

  box-shadow:
    0 30px 70px rgba(0,0,0,.55),
    inset 0 0 35px rgba(255,240,200,.18);

  transition:
    transform 1.8s cubic-bezier(.7,0,.3,1),
    opacity 1.4s ease,
    filter 1.5s ease;
}

.hole {
  position: absolute;
  width: 28%;
  aspect-ratio: 1;
  left: 50%;
  top: 50%;
  transform: translate(-50%,-50%);

  border: 0;
  border-radius: 50%;
  padding: 0;

  background: #07090f;
  color: white;
  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: clamp(10px,1.5vw,14px);
  line-height: 1.7;
  letter-spacing: .05em;
  text-align: center;

  box-shadow: inset 0 0 22px rgba(0,0,0,.9);

  animation: holeGrows 2.8s 1.1s ease-in-out forwards;
}

@keyframes holeGrows {
  from { width: 28%; }
  to   { width: 37%; }
}

.hole:hover {
  width: 40%;
}

/* 押した瞬間、真ん中を通る */
body.entering .title {
  opacity: 0;
}

body.entering .donut {
  transform: scale(7);
  opacity: 0;
  filter: blur(9px);
}

body.entering .entrance {
  pointer-events: none;
}

/* ───── 昨日の夜 ───── */

.yesterday {
  position: fixed;
  inset: 0;
  z-index: 1;
  overflow: hidden;

  background:
    radial-gradient(circle at 70% 20%,
      rgba(72,83,125,.18),
      transparent 30%),
    linear-gradient(
      180deg,
      #050711 0%,
      #090d1b 48%,
      #111426 100%
    );
}

/* 最初は夜自体も見せない */
.night-cover {
  position: absolute;
  inset: 0;
  z-index: 20;
  background: #030407;
  opacity: 1;
  pointer-events: none;
}

/* 「昨日の夜」 */
.yesterday-text {
  position: absolute;
  left: 8vw;
  top: 12vh;

  font-size: clamp(18px,3vw,28px);
  line-height: 2;
  letter-spacing: .08em;

  opacity: 0;
  transform: translateY(8px);
}

/* 月 */
.moon {
  position: absolute;
  right: 13vw;
  top: 16vh;

  width: clamp(58px,9vw,105px);
  aspect-ratio: 1;
  border-radius: 50%;

  background:
    radial-gradient(circle at 38% 35%,
      #fffdf2,
      #e9e4d1 55%,
      #c8c2ae 100%);

  box-shadow:
    0 0 25px rgba(239,235,213,.16),
    0 0 70px rgba(239,235,213,.08);

  opacity: 0;
  transform: translateY(-8px);
}

/* ───── 白 ─────
   閉じた輪郭を作らない。
   「白い物体」ではなく、白そのものが移動する。
*/

.white-presence {
  position: absolute;
  left: -65vw;
  bottom: -12vh;

  width: 85vw;
  height: 55vh;

  opacity: 0;

  background:
    radial-gradient(
      ellipse at 48% 55%,
      rgba(255,255,255,.86) 0%,
      rgba(255,255,255,.56) 18%,
      rgba(255,255,255,.24) 38%,
      rgba(255,255,255,.08) 56%,
      transparent 72%
    );

  filter: blur(18px);

  transform:
    translateX(0)
    translateY(0)
    rotate(-3deg);
}

.roll-text {
  position: absolute;
  left: 9vw;
  bottom: 17vh;

  font-size: clamp(19px,3vw,27px);
  letter-spacing: .18em;

  opacity: 0;
}

/* ───── 夜へ入った後の時間 ───── */

body.night .entrance {
  opacity: 0;
}

body.night .night-cover {
  animation: revealNight 1.8s ease forwards;
}

body.night .yesterday-text {
  animation:
    textIn 1.6s 1.2s ease forwards,
    textOut 1.4s 4.6s ease forwards;
}

body.night .moon {
  animation: moonIn 2.2s 3.2s ease forwards;
}

body.night .white-presence {
  animation: whiteRoll 6.5s 6s ease-out forwards;
}

body.night .roll-text {
  animation:
    rollWords 1.4s 6.5s ease forwards,
    rollWordsOut 1.5s 11s ease forwards;
}

@keyframes revealNight {
  to { opacity: 0; }
}

@keyframes textIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes textOut {
  to {
    opacity: 0;
  }
}

@keyframes moonIn {
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/*
  白は球にしない。
  ただし動きには「ころ、ころ」の小さな上下を入れる。
*/
@keyframes whiteRoll {
  0% {
    left: -65vw;
    opacity: 0;
    transform: translateY(4vh) rotate(-4deg);
  }

  12% {
    opacity: .25;
  }

  25% {
    transform: translateY(-1vh) rotate(2deg);
  }

  42% {
    transform: translateY(3vh) rotate(-2deg);
  }

  60% {
    transform: translateY(-1vh) rotate(2deg);
  }

  78% {
    transform: translateY(2vh) rotate(-1deg);
  }

  100% {
    left: 5vw;
    opacity: .9;
    transform: translateY(0) rotate(0);
  }
}

@keyframes rollWords {
  to { opacity: 1; }
}

@keyframes rollWordsOut {
  to { opacity: 0; }
}

/* 小さい画面 */
@media (max-width: 600px) {
  .title {
    top: 10vh;
  }

  .donut {
    width: min(72vw,330px);
  }

  .yesterday-text {
    left: 9vw;
    top: 11vh;
  }

  .moon {
    right: 10vw;
    top: 18vh;
  }

  .white-presence {
    width: 120vw;
    height: 48vh;
  }
}
</style>
</head>

<body>

<!-- 昨日の夜は入口の後ろで待っている -->
<section class="yesterday">

  <div class="yesterday-text">
    その先にあったのは<br>
    昨日の夜
  </div>

  <div class="moon"></div>

  <div class="white-presence"></div>

  <div class="roll-text">
    ころ。ころころ。
  </div>

  <div class="night-cover"></div>

</section>


<!-- 入口 -->
<main class="entrance">

  <div class="title">白い朝</div>

  <div class="donut">
    <button
      class="hole"
      id="hole"
      aria-label="そこ、通れるよ">
      そこ、<br>
      通れるよ
    </button>
  </div>

</main>


<script>
const hole = document.getElementById("hole");

hole.addEventListener("click", () => {

  /* まずドーナツの中央を通る */
  document.body.classList.add("entering");

  /* 一度、暗闇を挟む */
  setTimeout(() => {
    document.body.classList.add("night");
  }, 1500);

});
</script>

</body>
</html>
